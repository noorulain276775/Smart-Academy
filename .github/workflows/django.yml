name: Django CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: academy
          MYSQL_USER: academy_user
          MYSQL_PASSWORD: strong_password
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SECRET_KEY: django-insecure-ci-secret-key
      DB_NAME: academy
      DB_USER: academy_user
      DB_PASSWORD: strong_password
      DB_HOST: 127.0.0.1
      DB_PORT: 3306

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install MySQL client libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black isort ruff bandit coverage

      - name: Django system check
        run: python manage.py check

      - name: Verify migrations are committed
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Ruff lint
        run: ruff check .

      - name: Black formatting
        run: black --check .

      - name: Import sorting
        run: isort . --check-only

      - name: Bandit security scan
        run: |
          bandit -r . \
          -x tests,school/management/commands/seed_demo_data.py

      - name: Run tests with coverage
        run: |
          coverage run manage.py test
          coverage report --fail-under=80
